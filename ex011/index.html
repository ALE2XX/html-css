<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midias em HTML5</title>
</head>
<body>
    <h1>Imagem dinámica</h1>
    <p>Tente abrir esse site em vários dispositivos diferentes ou simplesmente aumente e diminua o tamanho do seu navegador.</p>

    <picture>
        <source media="(max-width: 750px)" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width: 1000px)" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="Imagem flexível">
    </picture>

    <h1>Reproduzindo Áudio</h1>
    <p>Vamos aprender a reporduzir áudios em HTML5.</p>
    <audio>
        <source src="midia/Special - The Grey Room _ Clark Sims.mp3" type="audio/mpeg">
        <source src="midia/Special - The Grey Room _ Clark Sims.ogg" type="audio/ogg">
        <source src="midia/Special - The Grey Room _ Clark Sims.wav" type="audio/wav">
        <p>Seu navegador não suporta o elemento de áudio. <a href="midia/Special - The Grey Room _ Clark Sims.mp3">Clique aqui para baixar o áudio</a></p>
    </audio>
</body>
</html>
