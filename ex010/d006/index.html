<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags HTML</title>
</head>
<body>
    <h1>Tags em HTML</h1>
    <p>Em HTML5, podemos inserir os elementos da lista a seguir. Passe o mouse sobre os termos para descobrir qual tag deverá utilizar em cada caso</p>
    <br>
    <ul>
        <li><abbr title="Parágrafo em HTML5 &lt;p&gt;">Parágrafo</abbr></li>
        <li><abbr title="Lista ordenada em HTML5 &lt;ol&gt;">Lista ordenada</abbr></li>
        <li><abbr title="Lista não ordenada em HTML5 &lt;ul&gt;">Lista não ordenada</abbr></li>
        <li><abbr title="Lista de definição em HTML5 &lt;dl&gt;">Lista de definição</abbr></li>
        <li><abbr title="Titulos em HTML5 use &lt;h1&gt;">Títulos</abbr></li>
    </ul>
</body>
</html>
